<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>啟用院所帳號｜心域 Innera</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>
  :root {
    --innera-primary: #5b78d4;
    --innera-primary-dark: #3f5fbf;
    --innera-deep: #1d2b4f;
    --innera-bg: #f5f7fc;
    --innera-card-border: #dbe5ff;
    --innera-soft: #eef4ff;
    --innera-soft-border: #d6e2ff;
    --innera-text: #243454;
    --innera-muted: #6f7fa6;
    --innera-line: #e8eefb;
    --innera-success-bg: #eef4ff;
    --innera-success-text: #3f5fbf;
    --innera-error-bg: #fff4f3;
    --innera-error-text: #984b45;
  }
    input:focus {
      border-color: var(--innera-primary);
      box-shadow: 0 0 0 4px rgba(91, 120, 212, 0.12);
    }
    #activateStaffButton:hover {
      background: #3f5fbf !important;
    }

    #activateStaffButton:active {
      transform: translateY(1px);
    }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Noto Sans TC", sans-serif;
      background: var(--innera-bg);
      color: var(--innera-text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .activation-card {
      width: min(100%, 520px);
      background: #ffffff;
      border: 1px solid var(--innera-card-border);
      border-radius: 24px;
      padding: 36px;
      box-shadow: 0 18px 50px rgba(37, 61, 122, 0.10);
    }

    .brand {
      margin-bottom: 28px;
    }

    .brand-mark {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: var(--innera-primary);
      color: white;
      display: grid;
      place-items: center;
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 14px;
    }

    .eyebrow {
      margin: 0 0 6px;
      color: var(--innera-primary);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.12em;
    }

    h1 {
      margin: 0;
      font-size: 26px;
      color: var(--innera-deep);
    }

    .status-message {
      margin: 28px 0 0;
      padding: 18px;
      background: var(--innera-success-bg);
      border: 1px solid var(--innera-soft-border);
      border-radius: 16px;
      color: var(--innera-success-text);
    }

    .invite-content {
      display: none;
      margin-top: 28px;
    }

    .invite-content.show {
      display: block;
    }

    .clinic-name {
      margin: 0 0 8px;
      font-size: 22px;
      color: var(--innera-deep);
    }

    .invite-description {
      margin: 0 0 24px;
      color: var(--innera-muted);
      line-height: 1.7;
    }

    .invite-details {
      display: grid;
      gap: 14px;
      margin: 0;
    }

    .invite-row {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding: 14px 0;
      border-bottom: 1px solid var(--innera-line);
    }

    .invite-row span {
      color: var(--innera-muted);
    }

    .invite-row strong {
      text-align: right;
      color: var(--innera-deep);
    }

    .error {
      background: var(--innera-error-bg);
      color: var(--innera-error-text);
      border: 1px solid #f3d4d1;
    }

    @media (max-width: 540px) {
      .activation-card {
        padding: 26px 22px;
      }

      .invite-row {
        flex-direction: column;
        gap: 4px;
      }

      .invite-row strong {
        text-align: left;
      }
    }
  </style>
</head>

<body>

  <main class="activation-card">

    <div class="brand">
      <div class="brand-mark">I</div>

      <p class="eyebrow">INNERA CLINICAL</p>
      <h1>院所成員邀請</h1>
    </div>

    <div
      id="activationStatus"
      class="status-message"
    >
      正在確認邀請資料...
    </div>

    <section
      id="inviteContent"
      class="invite-content"
    >
      <h2
        id="inviteClinicName"
        class="clinic-name"
      >
        —
      </h2>

      <p class="invite-description">
        你收到一份加入心域醫療端的院所成員邀請。
      </p>

      <div class="invite-details">

        <div class="invite-row">
          <span>受邀成員</span>
          <strong id="inviteDisplayName">—</strong>
        </div>

        <div class="invite-row">
          <span>Email</span>
          <strong id="inviteEmail">—</strong>
        </div>

        <div class="invite-row">
          <span>角色</span>
          <strong id="inviteRole">—</strong>
        </div>

        <div class="invite-row">
          <span>邀請期限</span>
          <strong id="inviteExpiry">—</strong>
        </div>
        <div
        id="passwordSetupSection"
        style="
            display: none;
            margin-top: 28px;
            padding-top: 24px;
            border-top: 1px solid #e8eefb;
        "
        >
        <h3 style="margin: 0 0 8px;">
            設定登入密碼
        </h3>

        <p
            style="
            margin: 0 0 18px;
            color: #6f7fa6;
            line-height: 1.7;
            "
        >
            Email 已驗證完成。請設定之後登入心域醫療端使用的密碼。
        </p>

        <label
            for="staffPassword"
            style="
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            "
        >
            密碼
        </label>

        <input
            id="staffPassword"
            type="password"
            autocomplete="new-password"
            minlength="8"
            placeholder="至少 8 碼"
            style="
            width: 100%;
            height: 48px;
            border: 1px solid #dbe5ff;
            border-radius: 12px;
            padding: 0 14px;
            font: inherit;
            outline: none;
            "
        >

        <label
            for="staffPasswordConfirm"
            style="
            display: block;
            margin: 16px 0 8px;
            font-weight: 600;
            "
        >
            確認密碼
        </label>

        <input
            id="staffPasswordConfirm"
            type="password"
            autocomplete="new-password"
            minlength="8"
            placeholder="再次輸入密碼"
            style="
            width: 100%;
            height: 48px;
            border: 1px solid #dbe5ff;
            border-radius: 12px;
            padding: 0 14px;
            font: inherit;
            outline: none;
            "
        >

        <button
            id="activateStaffButton"
            type="button"
            style="
            width: 100%;
            min-height: 48px;
            margin-top: 20px;
            border: 0;
            border-radius: 12px;
            background: #5b78d4;
            transition: background 0.2s ease, transform 0.2s ease;
            color: white;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
            "
        >
            完成帳號啟用
        </button>

        <div
            id="passwordSetupMessage"
            style="
            display: none;
            margin-top: 14px;
            padding: 14px;
            border-radius: 12px;
            line-height: 1.6;
            "
        ></div>

      </div>
      </section>

  </main>


  <!-- Firebase compat SDK -->
  <script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-functions-compat.js"></script>

  <!-- 與醫療端使用相同 Firebase 專案 -->
  <script defer src="js/firebase-config.js"></script>

  <!-- Staff activation -->
  <script defer src="js/clinic/staff-activate.js"></script>

</body>
</html>
